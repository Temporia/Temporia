<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporia - Clean Red 3D Auth</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* ================= BỐ CỤC NỀN ================= */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            overflow: hidden; 
            /* Phủ nền đỏ kín 100% màn hình, dọn sạch viền trắng */
            background: radial-gradient(circle at center, #7f1d1d 0%, #450a0a 100%);
            display: flex; align-items: center; justify-content: center;
            height: 100vh; width: 100vw;
            position: relative;
        }

        /* TRỐNG ĐỒNG Ở GÓC */
        .rotating-drum {
            position: absolute; top: -16%; left: -12%;
            width: 90vh; height: 90vh;
            background-image: url('trongdong.png');
            background-size: contain; background-repeat: no-repeat; background-position: center;
            opacity: 0.4; z-index: 2; animation: spin-drum 90s linear infinite; pointer-events: none;
        }

        @keyframes spin-drum { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* ================= HIỆU ỨNG LẬT 3D (FLIP) ================= */
        /* Vùng không gian 3D */
        .auth-wrapper {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 450px;
            height: 560px; 
            perspective: 1200px; 
        }

        /* Lõi xoay */
        .auth-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); 
            transform-style: preserve-3d;
        }

        .auth-inner.is-flipped {
            transform: rotateY(180deg);
        }

        /* Thiết kế 2 mặt của thẻ */
        .auth-face {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden; 
            
            /* Glassmorphism cho cả 2 mặt */
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            padding: 40px;
            
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .auth-register {
            transform: rotateY(180deg);
        }

        /* ================= CHI TIẾT FORM ================= */
        .modal-header { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .modal-header h2 { font-size: 2rem; color: #f1f5f9; text-transform: uppercase; letter-spacing: 2px; font-family: serif; }
        .header-icon { font-size: 2.5rem; color: #fbbf24; }

        .auth-form { display: flex; flex-direction: column; gap: 18px; margin-top: 30px; text-align: left; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-label { font-size: 0.95rem; color: #cbd5e1; font-weight: 500; }
        
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-icon { position: absolute; left: 15px; color: #94a3b8; font-size: 1.1rem; }
        
        .input-field {
            width: 100%; padding: 14px 15px 14px 45px; font-size: 1rem; color: #f1f5f9;
            background-color: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px; outline: none; transition: all 0.3s ease;
        }
        .input-field:focus { border-color: #fbbf24; background-color: rgba(255, 255, 255, 0.12); }
        .input-field::placeholder { color: #94a3b8; }
        
        .submit-button {
            padding: 15px; font-size: 1.1rem; font-weight: bold; color: #fff;
            background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
            border: none; border-radius: 12px; cursor: pointer; box-shadow: 0 10px 20px rgba(217, 119, 6, 0.3);
            transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 10px;
            margin-top: 10px;
        }
        .submit-button:hover { transform: translateY(-2px); box-shadow: 0 15px 25px rgba(217, 119, 6, 0.5); }
        
        .modal-footer { text-align: center; font-size: 0.9rem; color: #cbd5e1; margin-top: 25px; }
        .toggle-link { color: #fbbf24; text-decoration: none; font-weight: bold; margin-left: 5px; cursor: pointer; }
        .toggle-link:hover { text-decoration: underline; }

    </style>
</head>
<body>

    <div class="rotating-drum"></div>

    <div class="auth-wrapper">
        <div class="auth-inner" id="authInner">
            
            <div class="auth-face auth-login">
                <div class="modal-header">
                    <i class="fas fa-key header-icon"></i>
                    <h2>Đăng nhập</h2>
                </div>
                
                <form class="auth-form">
                    <div class="input-group">
                        <label class="input-label">Email</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope input-icon"></i>
                            <input class="input-field" type="email" placeholder="Nhập email của bạn">
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="input-label">Mật khẩu</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock input-icon"></i>
                            <input class="input-field" type="password" placeholder="Nhập mật khẩu">
                        </div>
                    </div>

                    <button class="submit-button" type="submit">
                        Đăng nhập <i class="fas fa-sign-in-alt"></i>
                    </button>
                </form>

                <div class="modal-footer">
                    <p>Chưa có tài khoản? <a class="toggle-link" id="btnGoRegister">Đăng ký ngay</a></p>
                </div>
            </div>

            <div class="auth-face auth-register">
                <div class="modal-header">
                    <i class="fas fa-landmark header-icon"></i>
                    <h2>Đăng ký</h2>
                </div>
                
                <form class="auth-form">
                    <div class="input-group">
                        <label class="input-label">Email</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope input-icon"></i>
                            <input class="input-field" type="email" placeholder="Nhập email của bạn">
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="input-label">Mật khẩu</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock input-icon"></i>
                            <input class="input-field" type="password" placeholder="Tạo mật khẩu">
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="input-label">Xác nhận mật khẩu</label>
                        <div class="input-wrapper">
                            <i class="fas fa-check-circle input-icon"></i>
                            <input class="input-field" type="password" placeholder="Nhập lại mật khẩu">
                        </div>
                    </div>

                    <button class="submit-button" type="submit">
                        Tạo tài khoản <i class="fas fa-user-plus"></i>
                    </button>
                </form>

                <div class="modal-footer">
                    <p>Đã có tài khoản? <a class="toggle-link" id="btnGoLogin">Đăng nhập</a></p>
                </div>
            </div>

        </div>
    </div>

    <script>
        const authInner = document.getElementById('authInner');
        const btnGoRegister = document.getElementById('btnGoRegister');
        const btnGoLogin = document.getElementById('btnGoLogin');

        btnGoRegister.addEventListener('click', () => {
            authInner.classList.add('is-flipped');
        });

        btnGoLogin.addEventListener('click', () => {
            authInner.classList.remove('is-flipped');
        });
    </script>
</body>
</html>
